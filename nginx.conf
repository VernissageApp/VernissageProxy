upstream backend {
    server vernissage-api.internal:8080 max_fails=2 fail_timeout=3s;
    server vernissage-api.internal:8080 max_fails=2 fail_timeout=3s;
}

upstream frontend {
    server vernissage-web.internal:8080 max_fails=2 fail_timeout=3s;
    server vernissage-web.internal:8080 max_fails=2 fail_timeout=3s;
}

map "$http_content_type:$http_accept" $machine {
    default frontend;
    ~*json  backend;
}

# Reject scanner requests for technologies and sensitive files that Vernissage
# does not expose. Matching on the normalized URI keeps query strings irrelevant.
map $uri $scanner_path {
    default 0;

    # Vernissage does not run PHP or WordPress.
    ~*\.php[0-9]*(?:/|$) 1;
    ~*^/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login|wordpress)(?:/|$) 1;

    # Source-control metadata, environment files and deployment credentials.
    ~*(?:^|/)\.(?:env|git|svn|hg|aws|ssh)[^/]*(?:/|$) 1;

    # Dependency manifests and container files are never public assets.
    ~*(?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Dockerfile|docker-compose(?:\.[^/]*)?\.ya?ml)(?:/|$) 1;

    # Administration and diagnostics endpoints from stacks not used by Vernissage.
    ~*^/(?:phpmyadmin|pma|adminer|cgi-bin|vendor/phpunit|actuator|jolokia|server-status|server-info|manager/html|host-manager|jmx-console)(?:/|$) 1;
}

server {
    listen 8080;
    client_max_body_size 20M;

    if ($scanner_path) {
        return 404;
    }

    location /api/v1/ {
        resolver [fdaa::3];

        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;

        proxy_pass http://backend;
    }

    location /.well-known/ {
        resolver [fdaa::3];

        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;

        proxy_pass http://backend;
    }

    location /rss/ {
        resolver [fdaa::3];

        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;

        proxy_pass http://backend;
    }

    location /atom/ {
        resolver [fdaa::3];

        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;

        proxy_pass http://backend;
    }

    location / {
        resolver [fdaa::3];

        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;

        proxy_pass http://$machine;
    }
}
